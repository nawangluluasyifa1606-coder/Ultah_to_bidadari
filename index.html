    <style>
        .slide-kiri {
    animation: munculDariKiri 0.7s ease-out forwards !important;
}

@keyframes munculDariKiri {
    from {
        transform: translateX(-150%); /* Mulai jauh dari kiri luar layar */
        opacity: 0;
    }
    to {
        transform: translateX(0); /* Berhenti di posisi tengah pas */
        opacity: 1;
    }
}

/* Tambahkan ini di body biar gak bisa di-scroll ke samping pas animasi jalan */
body {
    overflow-x: hidden;
}
.ios-popup {
    border-radius: 20px !important;
    background: #1c1c1e !important;
    padding: 0 !important;
    width: 320px !important;
    overflow: hidden;
}

/* Ini yang bikin garisnya mentok horizontal */
.swal2-actions {
    width: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
    display: flex !important;
    align-items: stretch !important;
}

.ios-button {
    flex: 1 !important;
    margin: 0 !important;
    padding: 15px 0 !important;
    background: transparent !important;
    color: #0a84ff !important;
    font-size: 17px !important;
    font-weight: 600 !important;
    border: none !important;
    /* GARIS TIPIS - JANGAN PAKAI 100px */
    border-top: 0.5px solid #f8f8fd !important; 
    border-radius: 0 !important;
    box-shadow: none !important;
    cursor: pointer;
}

.ios-title {
    color: white !important;
    padding: 25px 20px 10px 20px !important;
}

.swal2-actions button + button {
    border-left: 0.5px solid #f8f8fa !important;
}

/* Pastikan container tombolnya rapat (gak ada gap) */
.swal2-actions {
    gap: 0 !important;
}
.swal2-image {
    mix-blend-mode: screen !important;
    background: transparent !important;
}
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

            background-size: 100%; background-position: center;
            background-attachment: fixed;
            height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden;
        }
        .overlay {
            background: rgba(0, 0, 0, 0.6); width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: flex-start; align-items: center;
            opacity: 0; transition: 1s; pointer-events: none;
        }
        .overlay.show { opacity: 1; pointer-events: auto; }
        .content-box { text-align: center; color: white; width: 90%; max-width: 400px; }
        .clock { font-size: 4rem; font-weight: 80; }
        .notif-card {
            background: rgba(255, 255, 255, 0.95); color: #333; padding: 15px;
            border-radius: 15px; text-align: left; margin: 30px 0; min-height: 100px;
        }
        .notif-header { display: flex; justify-content: space-between; font-size: 0.7rem; color: #888; margin-bottom: 5px; }
        .notif-body strong { color: #ff4d6d; }
        #teksAnimasi { font-size: 0.9rem; line-height: 1.4; min-height: 50px; }
        .btn-main {
            background: #f0f0f0; border: none; padding: 10px 20px; border-radius: 12px;
            color: #333; font-weight: 600; cursor: pointer; display: none; margin: 10px auto 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn-mulai-layar {
            background: white; color: black; padding: 12px 25px; border-radius: 12px;
            font-weight: bold; cursor: pointer; border: none; font-size: 1rem;
        }
    </style>
</head>

       window.onload = async function() {

if (music.paused) {

}
        // Cara otomatis: Setiap kali ada klik di layar, cek apakah itu tombol pop-up
document.addEventListener('click', function (e) {
    if (e.target.classList.contains('swal2-confirm') || 
        e.target.classList.contains('swal2-cancel') || 
        e.target.classList.contains('swal2-deny') ||

        // --- ATUR VOLUME DI SINI ---
        suara.volume = 0.1;
        
        suara.play().catch(e => console.log("Suara klik terblokir"));

}
});
    // STEP 1
    await Swal.fire({

    });
    
    if(typeof music !== 'undefined') { music.play().catch(() => console.log("Audio blocked")); }

    if (ok2) {

    } else {
        // STEP 2B
        await Swal.fire({

        const { value: ok3 } = await Swal.fire({

async function sayILoveYou() {

        function mulaiHalamanUtama() {
    Swal.close();
    document.getElementById('tampilanUtama').classList.add('show');
    jalankanKetikan(); // Animasi slide pertama kali bakal jalan dari sini
}

        function jalankanKetikan() {
    const kartu = document.querySelector('.notif-card');
    const suaraNotif = document.getElementById('notifSound'); // Ambil element audio notif
    
    document.getElementById('btnNext').style.display = "none";
    document.getElementById('teksAnimasi').innerHTML = "";

    // --- BAGIAN SUARA ---
    if (suaraNotif) {
        suaraNotif.currentTime = 0; // Biar kalau diklik cepet, suaranya ngulang dari awal
        suaraNotif.play().catch(e => console.log("Suara diblokir browser, butuh klik dulu"));
    }

    // --- BAGIAN ANIMASI ---
    kartu.classList.remove('slide-kiri');
    void kartu.offsetWidth; 
    kartu.classList.add('slide-kiri');

    let arrayTeks = [
        "Met ultah ya! Maaf banget ucapannya telat, kemarin sinyal dari bumi ke hati kamu lagi kena razia satpol PP. Intinya doa aku mah standar pabrik: sehat terus, makin pinter, dan jangan sampe lupa caranya nafas. ❤️",
        "Cieee yang udah lulus SMA! Selamat ya udah lepas dari seragam putih abu-abu, bentar lagi jadi maba yang pusing mikirin krs. Padahal pengen Hukum tapi yang ada malah PBA, BKI, MPI, PAI, IES.. itu prodi apa menu prasmanan? Wkwk. Apapun pilihannya, semoga nggak nyasar ke prodi 'Teknik Melupakan Mantan' ya! 😂",
        "Takutnya tahun depan aku udah jadi fosil atau lupa cara ngetik, jadi aku ucapin met ultah dari sekarang buat masa depan. Pokoknya kamu harus tetep keren apapun prodinya. Happy Birthday Fahira! You are my priority (setelah nasi uduk). ❤️"
    ];

    new Typed('#teksAnimasi', {
        strings: [arrayTeks[stepTeks]],
        typeSpeed: 50,
        showCursor: false,
        onComplete: () => {
            stepTeks++;
            if (stepTeks < arrayTeks.length) {
                document.getElementById('btnNext').style.display = "block";
            } else {
                document.getElementById('btnWA').style.display = "block";
            }
        }
    });
}
        function kirimWA() {
            window.location.href = "https://wa.me/6285367099983?text=Makasih%20!%20Aku%20udah%20baca%20semuanya%20❤️";
        }
        function updateTanggal() {
    const hari = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
    const bulan = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
    
    const d = new Date();
    let namaHari = hari[d.getDay()];
    let tanggal = d.getDate();
    let namaBulan = bulan[d.getMonth()];
    let tahun = d.getFullYear();
    
    // Tampilkan ke ID yang kita buat tadi
    document.getElementById("tanggalRealtime").innerHTML = namaHari + ", " + tanggal + " " + namaBulan + " " + tahun;
}

// Panggil fungsinya supaya jalan
updateTanggal();
